version: '3.8'

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}-backend:main
    container_name: uira_backend
    restart: always
    network_mode: host
    environment:
      - PORT=8000
      # OCI Vault OCID mappings — VaultService fetches values at runtime via Instance Principals
      - OCI_SECRET_DATABASE_URL=ocid1.vaultsecret.oc1.sa-saopaulo-1.amaaaaaakqk4tziabh44ljbmtawsq3bphfh336m3mmmv2jzppfng74wcxtha

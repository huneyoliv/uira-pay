version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: uira_mongodb
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-uira_dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-uira_dev_password}
    volumes:
      - mongodb_data:/data/db
    restart: always

volumes:
  mongodb_data:
